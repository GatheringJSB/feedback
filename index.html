<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLASS FEEDBACK</title>
<style>
  :root { --bg:#f5f7fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --primary:#4f46e5; --line:#e5e7eb; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:-apple-system,"Segoe UI","Noto Sans KR",sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; justify-content:space-between; align-items:center; padding:16px 24px; background:var(--card); border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:1.2rem; letter-spacing:.12em; color:var(--primary); }
  main { max-width:640px; margin:0 auto; padding:48px 20px; text-align:center; }
  h2 { font-size:1.7rem; margin:0 0 32px; }
  .btns { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--card); border-radius:14px; padding:12px 18px; transition:.15s; }
  button:hover { border-color:var(--primary); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .vote { flex:1 1 150px; font-size:1.2rem; padding:28px 12px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
  .vote:hover { transform:translateY(-3px); }
  .primary { background:var(--primary); color:#fff; border-color:var(--primary); }
  .danger { color:#dc2626; border-color:#fecaca; }
  .msg { margin-top:28px; min-height:1.5em; font-weight:600; }
  .ok { color:#059669; } .err { color:#dc2626; }
  .hidden { display:none; }
  form { display:flex; flex-direction:column; gap:12px; max-width:320px; margin:0 auto; text-align:left; }
  input { font:inherit; padding:12px; border:1px solid var(--line); border-radius:10px; }
  .total { font-size:1rem; color:var(--muted); margin-bottom:24px; }
  .total b { color:var(--text); font-size:1.6rem; }
  .row { display:flex; align-items:center; gap:12px; margin:14px 0; text-align:left; }
  .label { width:96px; flex:none; }
  .track { flex:1; height:28px; background:#eceff5; border-radius:8px; overflow:hidden; }
  .bar { height:100%; width:0; transition:width .4s; }
  .num { width:84px; text-align:right; flex:none; font-variant-numeric:tabular-nums; }
  .tools { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:32px; }
</style>
</head>
<body>
<header>
  <h1>CLASS FEEDBACK</h1>
  <button id="loginBtn">관리자 로그인</button>
</header>

<main id="student">
  <h2>오늘 수업은 어땠나요?</h2>
  <div class="btns">
    <button class="vote" data-r="satisfied">😊 만족</button>
    <button class="vote" data-r="neutral">😐 보통</button>
    <button class="vote" data-r="dissatisfied">😞 불만족</button>
  </div>
  <div class="msg" id="voteMsg"></div>
</main>

<main id="login" class="hidden">
  <h2>관리자 로그인</h2>
  <form id="loginForm">
    <input type="email" id="email" placeholder="이메일" required autocomplete="username">
    <input type="password" id="password" placeholder="비밀번호" required autocomplete="current-password">
    <button class="primary" type="submit">로그인</button>
    <button type="button" id="cancelLogin">취소</button>
  </form>
  <div class="msg err" id="loginMsg"></div>
</main>

<main id="admin" class="hidden">
  <h2>수업 만족도 결과</h2>
  <div class="total">전체 투표 수 <b id="total">0</b>표</div>
  <div class="row"><span class="label">😊 만족</span><div class="track"><div class="bar" id="bar-satisfied" style="background:#10b981"></div></div><span class="num" id="num-satisfied"></span></div>
  <div class="row"><span class="label">😐 보통</span><div class="track"><div class="bar" id="bar-neutral" style="background:#f59e0b"></div></div><span class="num" id="num-neutral"></span></div>
  <div class="row"><span class="label">😞 불만족</span><div class="track"><div class="bar" id="bar-dissatisfied" style="background:#ef4444"></div></div><span class="num" id="num-dissatisfied"></span></div>
  <div class="tools">
    <button id="refreshBtn">새로고침</button>
    <button id="resetBtn" class="danger">투표 결과 초기화</button>
    <button id="logoutBtn">로그아웃</button>
  </div>
  <div class="msg" id="adminMsg"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const db = supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_PUBLISHABLE_KEY);
const $ = id => document.getElementById(id);
const RATINGS = ['satisfied', 'neutral', 'dissatisfied'];

function show(view) {
  ['student', 'login', 'admin'].forEach(v => $(v).classList.toggle('hidden', v !== view));
  $('loginBtn').classList.toggle('hidden', view === 'admin');
}

document.querySelectorAll('.vote').forEach(btn => btn.addEventListener('click', async () => {
  const buttons = document.querySelectorAll('.vote');
  buttons.forEach(b => b.disabled = true);
  const { error } = await db.from('votes').insert({ rating: btn.dataset.r });
  $('voteMsg').className = 'msg ' + (error ? 'err' : 'ok');
  $('voteMsg').textContent = error ? '투표 저장에 실패했습니다. 다시 시도해 주세요.' : '투표가 완료되었습니다. 감사합니다.';
  buttons.forEach(b => b.disabled = false);
}));

$('loginBtn').onclick = () => { $('loginMsg').textContent = ''; show('login'); };
$('cancelLogin').onclick = () => show('student');

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const { error } = await db.auth.signInWithPassword({ email: $('email').value, password: $('password').value });
  if (error) { $('loginMsg').textContent = '로그인에 실패했습니다. 이메일과 비밀번호를 확인하세요.'; return; }
  $('password').value = '';
  await openAdmin();
});

async function loadResults() {
  const { data, error } = await db.from('votes').select('rating');
  if (error) { $('adminMsg').className = 'msg err'; $('adminMsg').textContent = '결과를 불러오지 못했습니다.'; return; }
  $('adminMsg').textContent = '';
  const counts = { satisfied: 0, neutral: 0, dissatisfied: 0 };
  data.forEach(v => { if (v.rating in counts) counts[v.rating]++; });
  const total = data.length;
  $('total').textContent = total;
  RATINGS.forEach(r => {
    const pct = total ? Math.round(counts[r] / total * 1000) / 10 : 0;
    $('num-' + r).textContent = `${counts[r]}표 (${pct}%)`;
    $('bar-' + r).style.width = pct + '%';
  });
}

async function openAdmin() { show('admin'); await loadResults(); }

$('refreshBtn').onclick = loadResults;

$('resetBtn').onclick = async () => {
  if (!confirm('모든 투표 결과를 초기화하시겠습니까? 삭제된 결과는 복구할 수 없습니다.')) return;
  const { error } = await db.from('votes').delete().not('id', 'is', null);
  if (error) { $('adminMsg').className = 'msg err'; $('adminMsg').textContent = '초기화에 실패했습니다.'; return; }
  await loadResults();
};

$('logoutBtn').onclick = async () => {
  await db.auth.signOut();
  $('voteMsg').textContent = '';
  show('student');
};

db.auth.getSession().then(({ data }) => { if (data.session) openAdmin(); });
</script>
</body>
</html>
